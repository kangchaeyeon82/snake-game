<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운석 피하기</title>
<style>
  :root { --bg:#111827; --panel:#1f2937; --text:#e5e7eb; --muted:#9ca3af; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Malgun Gothic", sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { margin:8px 0 4px; font-size:24px; }
  .sub { color:var(--muted); margin-bottom:16px; font-size:14px; }
  .sub a { color:var(--accent); }
  .wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .panel { background:var(--panel); border-radius:12px; padding:16px; }
  #game { background:#050816; border-radius:8px; display:block; max-width:100%; }
  #cam { border-radius:8px; display:block; background:#000; }
  .row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:18px; }
  button { background:var(--accent); color:#04121a; border:0; border-radius:8px; padding:10px 16px;
           font-size:16px; font-weight:700; cursor:pointer; margin-right:6px; }
  button:disabled { opacity:.5; cursor:default; }
  .bars { margin-top:12px; width:300px; }
  .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px; }
  .bar span { width:44px; }
  .track { flex:1; height:16px; background:#374151; border-radius:8px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--muted); transition:width .1s; }
  .fill.active { background:var(--accent); }
  #status { color:var(--muted); font-size:14px; margin-top:10px; min-height:20px; max-width:400px; }
  #dir { font-size:40px; text-align:center; margin-top:8px; }
  label { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<h1>☄️ 운석 피하기 & 별 줍기</h1>
<div class="sub">포즈로 우주선을 움직여 ⭐을 모으고 운석을 피하세요 · <a href="index.html">🐍 뱀 게임으로</a></div>

<div class="wrap">
  <div class="panel">
    <div class="row"><div>점수: <b id="score">0</b></div><div>목숨: <b id="lives">❤️❤️❤️</b></div><div>최고: <b id="best">0</b></div></div>
    <canvas id="game" width="400" height="400"></canvas>
    <div style="margin-top:12px">
      <button id="camBtn">📷 웹캠 시작</button>
      <button id="startBtn">▶ 게임 시작</button>
    </div>
    <div style="margin-top:10px">
      <label>인식 기준 <input id="thresh" type="range" min="0.5" max="0.99" step="0.01" value="0.8"> <b id="threshVal">0.80</b></label>
    </div>
    <div id="status">웹캠 시작 후 게임 시작을 누르세요. (방향키로도 조작 가능)</div>
  </div>

  <div class="panel">
    <label>카메라 <select id="camSelect"><option value="">(웹캠 시작 시 목록 표시)</option></select></label>
    <canvas id="cam" width="300" height="300" style="margin-top:8px"></canvas>
    <div id="dir">–</div>
    <div class="bars" id="bars"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/jq28dBmP8/";

// ---------- 운석 피하기 게임 ----------
const game = document.getElementById("game");
const g = game.getContext("2d");
const CELL = 20, COLS = game.width / CELL, ROWS = game.height / CELL;
const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
const ARROWS = { up:"⬆️", down:"⬇️", left:"⬅️", right:"➡️" };
const MOVE_MS = 150;          // 우주선이 한 칸 움직이는 간격
const STEP_MS = 50;           // 게임 루프 간격

let player, meteors, star, score, lives, invincibleUntil, fallMs, spawnChance;
let moveAcc, fallAcc, running = false, timer = null, now = 0;
let poseDir = null, keyDir = null;
let best = Number(localStorageGet("dodgeBest") || 0);
document.getElementById("best").textContent = best;

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function resetGame() {
  player = { x: Math.floor(COLS / 2), y: ROWS - 2 };
  meteors = [];
  score = 0; lives = 3; invincibleUntil = 0;
  fallMs = 400; spawnChance = 0.25;
  moveAcc = 0; fallAcc = 0; now = 0;
  placeStar();
  updateHud();
}

function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
}

function placeStar() {
  do { star = { x: Math.floor(Math.random()*COLS), y: 2 + Math.floor(Math.random()*(ROWS-2)) }; }
  while (star.x === player.x && star.y === player.y);
}

function step() {
  now += STEP_MS;

  // 우주선 이동: 키보드가 눌려 있으면 우선, 아니면 포즈 방향
  moveAcc += STEP_MS;
  const d = keyDir || poseDir;
  if (moveAcc >= MOVE_MS) {
    moveAcc = 0;
    if (d) {
      player.x = Math.max(0, Math.min(COLS - 1, player.x + DIRS[d].x));
      player.y = Math.max(0, Math.min(ROWS - 1, player.y + DIRS[d].y));
    }
  }

  // 운석 낙하 + 새 운석 생성
  fallAcc += STEP_MS;
  if (fallAcc >= fallMs) {
    fallAcc = 0;
    meteors.forEach(m => m.y++);
    meteors = meteors.filter(m => m.y < ROWS);
    if (Math.random() < spawnChance) meteors.push({ x: Math.floor(Math.random()*COLS), y: 0 });
  }

  // 별 획득: 5개마다 운석이 더 빠르고 많아짐
  if (player.x === star.x && player.y === star.y) {
    score++;
    if (score % 5 === 0) {
      fallMs = Math.max(120, fallMs - 40);
      spawnChance = Math.min(0.8, spawnChance + 0.08);
    }
    placeStar();
    updateHud();
  }

  // 운석 충돌: 맞으면 목숨 -1, 1.5초 무적
  const hit = meteors.findIndex(m => m.x === player.x && m.y === player.y);
  if (hit >= 0 && now >= invincibleUntil) {
    meteors.splice(hit, 1);
    lives--;
    invincibleUntil = now + 1500;
    updateHud();
    if (lives <= 0) return gameOver();
  }

  draw();
}

function draw() {
  g.fillStyle = "#050816"; g.fillRect(0, 0, game.width, game.height);
  g.font = `${CELL}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("⭐", star.x*CELL + CELL/2, star.y*CELL + CELL/2 + 1);
  meteors.forEach(m => g.fillText("☄️", m.x*CELL + CELL/2, m.y*CELL + CELL/2 + 1));
  // 무적 시간에는 깜빡임
  if (now >= invincibleUntil || Math.floor(now / 150) % 2 === 0) {
    g.fillText("🚀", player.x*CELL + CELL/2, player.y*CELL + CELL/2 + 1);
  }
}

function gameOver() {
  running = false; clearInterval(timer);
  if (score > best) { best = score; localStorageSet("dodgeBest", best); document.getElementById("best").textContent = best; }
  draw();
  g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, 0, game.width, game.height);
  g.fillStyle = "#fff"; g.font = "bold 32px sans-serif";
  g.fillText("GAME OVER", game.width/2, game.height/2 - 14);
  g.font = "18px sans-serif";
  g.fillText(`별 ${score}개 · 다시 하려면 게임 시작`, game.width/2, game.height/2 + 22);
  document.getElementById("startBtn").textContent = "▶ 다시 시작";
}

function startGame() {
  resetGame(); draw();
  running = true;
  clearInterval(timer);
  timer = setInterval(step, STEP_MS);
}

document.getElementById("startBtn").onclick = startGame;
const threshInput = document.getElementById("thresh");
threshInput.oninput = () => document.getElementById("threshVal").textContent = Number(threshInput.value).toFixed(2);

const KEYS = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right" };
document.addEventListener("keydown", e => { if (KEYS[e.key]) { e.preventDefault(); keyDir = KEYS[e.key]; } });
document.addEventListener("keyup", e => { if (KEYS[e.key] === keyDir) keyDir = null; });

resetGame(); draw();

// ---------- 티처블머신 포즈 모델 ----------
let model, webcam, camCtx, labels = [];
const statusEl = document.getElementById("status");

async function initCam() {
  const btn = document.getElementById("camBtn");
  btn.disabled = true;
  statusEl.textContent = "모델 불러오는 중...";
  try {
    model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    labels = model.getClassLabels();
    buildBars();

    statusEl.textContent = "웹캠 켜는 중...";
    await checkCamera();
    const deviceId = await fillCameraList();
    webcam = new tmPose.Webcam(300, 300, true); // true = 좌우 반전(거울 모드)
    await webcam.setup(deviceId ? { deviceId: { exact: deviceId } } : {});
    await webcam.play();

    const cam = document.getElementById("cam");
    camCtx = cam.getContext("2d");
    statusEl.textContent = "준비 완료! 게임 시작을 누르세요.";
    btn.textContent = "📷 웹캠 켜짐";
    window.requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "오류: " + (err && err.message ? err.message : String(err));
    btn.disabled = false;
  }
}

// tmPose는 카메라 오류 원인을 숨기므로 먼저 직접 요청해서 실제 원인을 알려준다
async function checkCamera() {
  if (!window.isSecureContext) throw new Error("보안 연결이 아닙니다. http://localhost:8000 으로 접속하세요.");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("이 브라우저는 웹캠을 지원하지 않습니다. 크롬/엣지를 사용하세요.");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    const reasons = {
      NotAllowedError: "카메라 권한이 차단되었습니다. 주소창 왼쪽 아이콘 → 카메라 '허용' 후 새로고침하세요. 그래도 안 되면 Windows 설정 → 개인 정보 및 보안 → 카메라에서 '데스크톱 앱 액세스'를 켜세요.",
      NotFoundError: "연결된 카메라를 찾을 수 없습니다. 웹캠 연결을 확인하세요.",
      NotReadableError: "카메라를 다른 프로그램(Zoom, 카메라 앱, 다른 브라우저 탭 등)이 사용 중입니다. 닫고 다시 시도하세요.",
      OverconstrainedError: "카메라가 요청한 설정을 지원하지 않습니다.",
    };
    throw new Error(reasons[e.name] || `${e.name}: ${e.message}`);
  }
}

// 카메라 목록을 채우고, 가상 카메라보다 실제 카메라를 우선 선택
async function fillCameraList() {
  const sel = document.getElementById("camSelect");
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  if (!sel.value) {
    sel.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || "카메라 " + (i + 1)}</option>`).join("");
    const real = cams.find(c => !/virtual|가상|obs|mirametrix/i.test(c.label));
    if (real) sel.value = real.deviceId;
  }
  return sel.value;
}

// 카메라를 바꾸면 새 카메라로 다시 시작
document.getElementById("camSelect").onchange = async () => {
  if (!webcam) return;
  const deviceId = document.getElementById("camSelect").value;
  const newCam = new tmPose.Webcam(300, 300, true);
  try {
    webcam.stop(); // 일부 카메라는 동시에 두 번 열 수 없어서 먼저 끔
    await newCam.setup({ deviceId: { exact: deviceId } });
    await newCam.play();
    webcam = newCam; // 준비가 끝난 뒤 교체해야 루프가 멈추지 않음
    statusEl.textContent = "카메라를 바꿨습니다.";
  } catch (err) {
    statusEl.textContent = "오류: " + (err && err.message ? err.message : String(err));
  }
};

function buildBars() {
  const box = document.getElementById("bars");
  box.innerHTML = labels.map(l =>
    `<div class="bar"><span>${l}</span><div class="track"><div class="fill" id="bar-${l}"></div></div><b id="pct-${l}">0%</b></div>`
  ).join("");
}

async function loop() {
  webcam.update();
  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const prediction = await model.predict(posenetOutput);

  // 가장 확률 높은 클래스 찾기
  let top = prediction[0];
  for (const p of prediction) if (p.probability > top.probability) top = p;
  const threshold = Number(threshInput.value);

  for (const p of prediction) {
    const name = p.className;
    const fill = document.getElementById("bar-" + name);
    fill.style.width = (p.probability * 100).toFixed(0) + "%";
    fill.classList.toggle("active", p === top && p.probability >= threshold);
    document.getElementById("pct-" + name).textContent = (p.probability * 100).toFixed(0) + "%";
  }

  // 확신이 기준 미만이면 멈춤 (뱀 게임과 달리 우주선은 정지할 수 있음)
  const d = top.className.toLowerCase().trim();
  poseDir = top.probability >= threshold && DIRS[d] ? d : null;
  document.getElementById("dir").textContent = poseDir ? ARROWS[poseDir] + " " + poseDir : "⏸ 정지";

  // 웹캠 + 스켈레톤 그리기
  camCtx.drawImage(webcam.canvas, 0, 0);
  if (pose) {
    tmPose.drawKeypoints(pose.keypoints, 0.5, camCtx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, camCtx);
  }
  window.requestAnimationFrame(loop);
}

document.getElementById("camBtn").onclick = initCam;
</script>
</body>
</html>
